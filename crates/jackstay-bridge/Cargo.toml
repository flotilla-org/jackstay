[package]
name = "jackstay-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-host Jackstay bridge: an egress half that encodes a local publication and an ingress half that republishes it"

[features]
# VideoToolbox encode/decode and the macOS native arena roles. Off by default so
# the wire, clock and policy code builds and tests anywhere.
backend-macos = ["dep:cc", "jackstay/backend-macos"]

[build-dependencies]
cc = { version = "1", optional = true }

[dependencies]
jackstay = { path = "../jackstay" }
jackstay-graph = { path = "../jackstay-graph" }
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[[bin]]
name = "jackstay-bridge"
path = "src/bin/jackstay-bridge.rs"

[lints]
workspace = true
