[package]
name = "capture-transfer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# The real macOS NativeFrameBackend (IOSurface + Metal). A feature rather
# than bare cfg(target_os) so mac builds that only need the CPU path skip
# the Metal/IOSurface linkage; the crate split is deferred (#84).
backend-macos = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }

[dependencies]
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
