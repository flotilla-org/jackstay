[package]
name = "jackstay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# The real macOS NativeFrameBackend (IOSurface + Metal). A feature rather
# than bare cfg(target_os) so mac builds that only need the CPU path skip
# the Metal/IOSurface linkage; the crate split is deferred (#84).
backend-macos = ["dep:cc"]
# Linux native transport/backend work (dmabuf + drm_syncobj). The first
# slices add the UDS + SCM_RIGHTS attach transport before the real backend.
backend-linux = ["dep:cc", "dep:pkg-config"]
# Windows native backend: D3D11 shared textures, ID3D11Fence timelines and
# Windows.Graphics.Capture sessions. A no-op on other targets.
backend-windows = ["dep:windows"]

[build-dependencies]
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }

# Windows builds compile the public C header smoke with MSVC (see build.rs).
[target.'cfg(windows)'.build-dependencies]
cc = "1"

[dependencies]
libc = "0.2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Already in the lockfile via tempfile. Pagefile-backed shared memory, the
# acquisition arena's wake events, process watches, page size and random scope,
# and the named-pipe Local Endpoint transport (Wheelhouse ADR 0011).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
# The D3D11 backend and Windows.Graphics.Capture. windows-sys has no COM or
# WinRT projections; `windows` comes from the same windows-rs release and
# shares windows-link with the windows-sys above.
windows = { version = "0.62.2", optional = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
# Test-only handle transfer into spawned children and a pipe completion source.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading"] }

[lints]
workspace = true

[[example]]
name = "wgc_session_watch"
required-features = ["backend-windows"]

[[example]]
name = "d3d11_source"
required-features = ["backend-windows"]
